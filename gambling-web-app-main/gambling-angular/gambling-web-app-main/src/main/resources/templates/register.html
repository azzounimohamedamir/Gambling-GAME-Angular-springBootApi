<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{register_gambling_game}">Register - Gambling Game</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="form-title" th:text="#{register_for_gambling_game}">Register for Gambling Game</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username" th:text="#{username}">Username</label>
                    <input type="text" id="username" name="username" required />
                </div>
                <div class="form-group">
                    <label for="password" th:text="#{password}">Password</label>
                    <input type="password" id="password" name="password" required />
                </div>
                <div class="form-group">
                    <label for="confirmPassword" th:text="#{confirm_password}">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required />
                </div>
                <button type="submit" class="btn" th:text="#{register}">Register</button>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div class="switch-form">
                    <p>
                        <span th:text="#{already_have_account}">Already have an account?</span>
                        <a href="/login" th:text="#{login_here}">Login here</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
